plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'com.murugan.buscontrol'
    compileSdk 34
    defaultConfig {
        applicationId 'com.murugan.buscontrol'
        minSdk 24; targetSdk 34
        versionCode 1; versionName '1.0'
        // your website, no trailing slash. Change here OR pass -PSITE_URL=https://xxx.vercel.app
        buildConfigField 'String', 'SITE_URL', "\"${project.findProperty('SITE_URL') ?: 'https://YOUR-SITE.vercel.app'}\""
    }
    buildFeatures { buildConfig true }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
